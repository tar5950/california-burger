<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHICK'N BEEF — Menuboard</title>
<!-- AUCUNE RESSOURCE EXTERNE : fonctionne sans internet. -->
<style>
@font-face{font-family:'CBDisplay';src:url('fonts/Anton.woff2') format('woff2');font-display:swap}
@font-face{font-family:'CBBody';src:url('fonts/NunitoSans.woff2') format('woff2');font-weight:700 800;font-display:swap}

:root{
  --rouge:#BE3C2A;      /* rouge du logo — la marque fait foi */
  --rouge-vif:#D62300;  /* rouge du site, pour les aplats qui claquent */
  --rouge-fonce:#8E2A1C;
  --or:#F5A623;
  --or-clair:#FFD166;
  --creme:#F9F4EE;
  --noir:#1A1A1A;
  --display:'CBDisplay',Impact,'Arial Narrow',sans-serif;
  --body:'CBBody',system-ui,-apple-system,'Segoe UI',sans-serif;
  --safe-x:2.4vw; --safe-y:2.2vh;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--noir);color:var(--creme);font-family:var(--body);
  overflow:hidden;-webkit-font-smoothing:antialiased}

/* ambiance : halos chauds qui dérivent */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb b{position:absolute;display:block;border-radius:50%;filter:blur(100px)}
.amb b:nth-child(1){width:60vw;height:60vw;left:-15vw;top:-22vw;
  background:rgba(190,60,42,.40);animation:d1 28s ease-in-out infinite}
.amb b:nth-child(2){width:50vw;height:50vw;right:-12vw;bottom:-18vw;
  background:rgba(245,166,35,.22);animation:d2 36s ease-in-out infinite}
@keyframes d1{0%,100%{transform:none}50%{transform:translate(10vw,6vh) scale(1.15)}}
@keyframes d2{0%,100%{transform:scale(1.1)}50%{transform:translate(-9vw,-6vh) scale(1)}}

/* onde qui traverse les 3 écrans */
.sweep{position:fixed;top:0;bottom:0;width:36vw;z-index:40;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,209,102,.12) 45%,rgba(255,255,255,.08) 52%,transparent);
  transform:translateX(-45vw) skewX(-8deg);animation:sw 10s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-45vw) skewX(-8deg)}55%,100%{transform:translateX(150vw) skewX(-8deg)}}

.board{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;
  flex-direction:column;padding:var(--safe-y) var(--safe-x);gap:1.3vh}

/* ── EN-TÊTE ── */
.head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:2vw}
.brand{display:flex;align-items:center;gap:1.1vw;min-width:0}
.logo{height:8.4vh;width:auto;flex:0 0 auto;filter:drop-shadow(0 .4vh 1.2vh rgba(0,0,0,.6))}
.btxt{display:flex;flex-direction:column;line-height:1}
.btxt .bl{font-family:var(--display);font-size:1.6vh;letter-spacing:.34em;color:var(--or)}
.btxt .kiff{font-family:var(--display);font-size:3.4vh;letter-spacing:.06em;color:var(--creme);margin-top:.5vh}
.hr{display:flex;align-items:center;gap:1.4vw}
.halal{font-family:var(--display);font-size:2vh;letter-spacing:.12em;background:var(--or);
  color:var(--noir);padding:.7vh 1.1vw;border-radius:.6vh;position:relative;overflow:hidden}
.state{display:inline-flex;align-items:center;gap:.6vw;font-family:var(--display);
  font-size:2vh;letter-spacing:.1em}
.state i{width:1.3vh;height:1.3vh;border-radius:50%;display:block;animation:p 1.8s ease-in-out infinite}
.state.open{color:var(--or-clair)} .state.open i{background:var(--or-clair)}
.state.shut{color:#ff7a6b} .state.shut i{background:#ff7a6b}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
.clock{font-family:var(--display);font-size:3.6vh;letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* ── 3 PANNEAUX ── */
.screens{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1vw}
.panel{position:relative;min-height:0;overflow:hidden;border-radius:1.2vh;background:#120F0E;
  display:flex;flex-direction:column;box-shadow:0 0 0 2px rgba(245,166,35,.42)}
.cat{flex:0 0 auto;background:var(--rouge);color:var(--creme);font-family:var(--display);
  font-size:2.9vh;letter-spacing:.09em;padding:1.1vh 1vw;display:flex;align-items:center;
  justify-content:space-between;position:relative;overflow:hidden}
.cat .n{font-size:.6em;letter-spacing:.14em;background:var(--or);color:var(--noir);
  padding:.35em .7em;border-radius:.4em}

/* reflet qui balaie les bandeaux */
.cat::after,.halal::after,.foot::after{content:"";position:absolute;top:0;bottom:0;width:40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-160%);animation:sh 7s ease-in-out infinite}
.halal::after{animation-delay:2.2s}.foot::after{animation-delay:1.1s}
@keyframes sh{0%{transform:translateX(-160%)}45%,100%{transform:translateX(320%)}}

/* ── VITRINE ── */
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(1.05);
  transition:opacity .55s ease,transform .8s cubic-bezier(.2,.8,.25,1),visibility .55s}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.out{opacity:0;visibility:visible;transform:scale(.97);transition:opacity .45s ease,transform .6s ease}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.on .photo{animation:ken 12s cubic-bezier(.3,0,.5,1) both}
@keyframes ken{0%{transform:scale(1.12) translate(1%,.8%)}100%{transform:scale(1.01) translate(-1%,-.8%)}}
.ph-fb{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 25%,var(--or),#8E5A08 72%)}
/* voile rouge en bas : garantit le contraste sur leurs fonds jaunes */
.veil{position:absolute;left:0;right:0;bottom:0;height:56%;
  background:linear-gradient(180deg,rgba(26,16,12,0),rgba(26,16,12,.82) 44%,rgba(18,11,8,.97))}
.cap{position:absolute;left:0;right:0;bottom:0;padding:1.4vh 1vw 2vh}
.cap .nom{font-family:var(--display);font-size:7.4vh;line-height:.95;color:var(--creme);
  text-shadow:0 .3vh 1.4vh rgba(0,0,0,.9)}
.cap .desc{font-size:1.9vh;line-height:1.3;color:rgba(249,244,238,.86);font-weight:700;margin-top:.6vh}
.cap .prix{display:inline-block;font-family:var(--display);font-size:7vh;line-height:1;
  background:var(--or);color:var(--noir);padding:.9vh 1.1vw;border-radius:1vh;margin-top:1.1vh}
.cap .prix .c{font-size:.46em;vertical-align:.52em}
.wipe{position:absolute;inset:0;z-index:7;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,var(--or) 45%,#fff 50%,var(--or) 55%,transparent 80%);
  transform:translateX(-115%) skewX(-10deg);opacity:.9}
.wipe.go{animation:wp .85s cubic-bezier(.5,0,.3,1)}
@keyframes wp{to{transform:translateX(115%) skewX(-10deg)}}
.dots{position:absolute;right:1vw;bottom:1.2vh;display:flex;gap:.45vw;z-index:8}
.dots i{width:.9vh;height:.9vh;border-radius:50%;background:rgba(249,244,238,.3)}
.dots i.on{background:var(--or);width:2.6vh;border-radius:.45vh}

/* ── PANNEAUX FIXES ── */
.fixed{flex:1 1 auto;min-height:0;padding:1.4vh 1vw;display:flex;flex-direction:column;
  gap:.85vh;overflow:hidden;position:relative}
.note{font-size:1.7vh;color:rgba(249,244,238,.62);font-weight:700}
.rows{display:flex;flex-direction:column;gap:1.6vh;flex:1 1 auto;min-height:0;justify-content:center}
/* ecran 2 : panneau des prix principaux, on exploite toute la hauteur */
[data-screen="2"] .row .n{font-size:5.4vh}
[data-screen="2"] .duo .menu{font-size:5.4vh}
[data-screen="2"] .duo .seul{font-size:1.8vh}
[data-screen="2"] .row .p{font-size:5.4vh}
/* l'ecran 3 porte 8 lignes + 2 intertitres : on resserre */
[data-screen="3"] .fixed{gap:1.1vh}
[data-screen="3"] .row{gap:.5vw}
[data-screen="3"] .sect{margin-top:.2vh;padding-bottom:.3vh}
body.solo [data-screen="3"] .fixed{gap:1.2vh}
.row{display:flex;align-items:baseline;gap:.6vw}
.row .n{font-family:var(--display);font-size:4.2vh;color:var(--creme);line-height:1.04}
.row .d{font-size:1.6vh;color:rgba(249,244,238,.58);font-weight:700}
.row .dot{flex:1;border-bottom:.25vh dotted rgba(249,244,238,.2);transform:translateY(-.5vh)}
.row .p{font-family:var(--display);font-size:4.2vh;color:var(--or);line-height:1}
.row .p .c{font-size:.46em;vertical-align:.5em}
.row .p.vide{font-size:2.4vh;color:rgba(249,244,238,.34)}
.row .n.petit{font-size:3.8vh}
.row .p.petit{font-size:3.8vh}
.duo{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.duo .menu{font-family:var(--display);font-size:4.2vh;color:var(--or)}
.duo.petit .menu{font-size:3.8vh}
.duo .menu .c{font-size:.46em;vertical-align:.5em}
.duo .seul{font-size:1.4vh;font-weight:700;color:rgba(249,244,238,.5);margin-top:.25vh;white-space:nowrap}
.duo.petit .seul{font-size:1.45vh}
.cap .prix{position:relative}
.cap .prix .mlab{display:block;font-family:var(--body);font-size:.17em;font-weight:800;
  letter-spacing:.18em;margin-top:.15em;opacity:.78}
.cap .seulBig{font-size:1.9vh;font-weight:700;color:rgba(249,244,238,.62);margin-top:.7vh}
.sect{font-family:var(--display);font-size:2.5vh;letter-spacing:.12em;color:var(--or);
  border-bottom:.25vh solid rgba(245,166,35,.34);padding-bottom:.4vh;margin-top:.4vh}
.bgph{position:absolute;right:-6%;bottom:-6%;width:62%;opacity:.14;pointer-events:none;
  mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent 72%);
  -webkit-mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent 72%)}

/* ── BANDEAU BAS ── */
.foot{flex:0 0 auto;background:var(--rouge);color:var(--creme);border-radius:1vh;
  padding:1vh 1.2vw;display:flex;align-items:center;justify-content:space-between;gap:2vw;
  font-family:var(--display);font-size:2vh;letter-spacing:.09em;position:relative;overflow:hidden}
.foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MODE 1 ÉCRAN (?ecran=1|2|3) ── */
body.solo .screens{grid-template-columns:1fr}
body.solo .panel{display:none}
body.solo .panel.show{display:flex}
body.solo .logo{height:6.4vh}
body.solo .cat{font-size:3.6vh}
body.solo .cap .nom{font-size:11vh}
body.solo .cap .prix{font-size:10vh}
body.solo .row .n,body.solo .row .p{font-size:6.4vh}
body.solo .row .d{font-size:2.4vh}
body.solo .sect{font-size:3.2vh}
body.solo .note{font-size:2.6vh}

@media (prefers-reduced-motion:reduce){
  .amb b,.sweep,.cat::after,.halal::after,.foot::after,.wipe,.slide.on .photo{animation:none!important}
}
</style>
</head>
<body>
<div class="amb"><b></b><b></b></div>
<div class="sweep"></div>

<div class="board">
  <header class="head">
    <div class="brand">
      <img class="logo" src="img/logo-couleur.png" alt="Chick'n Beef">
      <div class="btxt">
        <span class="bl" id="baseline"></span>
        <span class="kiff" id="kiff"></span>
      </div>
    </div>
    <div class="hr">
      <span class="halal" id="halal"></span>
      <span class="state" id="state"><i></i><b id="stateTxt">—</b></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <main class="screens" id="screens"></main>

  <footer class="foot">
    <span id="footL"></span>
    <span id="footR"></span>
  </footer>
</div>

<script src="menu-data.js"></script>
<script>
/* prix français, sans centimes inutiles : 9 → 9€ · 9.9 → 9€90 */
function prix(v){
  if(v===null||v===undefined) return null;
  const e=Math.floor(v+1e-6), c=Math.round((v-e)*100);
  return c===0 ? e+'€' : e+'€<span class="c">'+String(c).padStart(2,'0')+'</span>';
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ÉCRAN 1 — vitrine */
function panelVitrine(){
  const s=MENU.vitrine.slides.map((x,i)=>{
    const ps=prix(x.prixSeul), pm=prix(x.prixMenu);
    return `<div class="slide${i===0?' on':''}" data-cat="${esc(x.cat)}">
      <div class="ph-fb"></div>
      <img class="photo" src="img/${esc(x.img)}" alt="${esc(x.nom)}" onerror="this.remove()">
      <div class="veil"></div>
      <div class="cap">
        <div class="nom">${esc(x.nom)}</div>
        <div class="desc">${esc(x.desc)}</div>
        ${pm?`<div class="prix">${pm}<span class="mlab">EN MENU</span></div>`
            :(ps?`<div class="prix">${ps}</div>`:'')}
        ${pm&&ps?`<div class="seulBig">seul ${ps}</div>`:''}
      </div></div>`}).join('');
  const nav=MENU.vitrine.slides.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');
  return `<section class="panel" data-screen="1" data-rot="1">
    <div class="cat"><span class="catTxt">${esc(MENU.vitrine.slides[0].cat)}</span></div>
    <div class="stage">${s}<div class="wipe"></div><div class="dots">${nav}</div></div>
  </section>`;
}

/* lignes prix réutilisables */
function ligne(o,gros){
  const ps=prix(o.prixSeul), pm=prix(o.prixMenu);
  const cls=gros?'':' petit';
  // le prix MENU est mis en avant : c'est lui qui porte le ticket moyen
  const bloc = pm
    ? `<span class="duo${cls}"><span class="menu">${pm}</span>${ps?`<span class="seul">seul ${ps}</span>`:''}</span>`
    : `<span class="p${cls}">${ps||'—'}</span>`;
  return `<div class="row">
    <span class="n${cls}">${esc(o.nom)}</span>
    ${o.desc?`<span class="d">${esc(o.desc)}</span>`:''}
    <span class="dot"></span>${bloc}
  </div>`;
}

/* ÉCRAN 2 — la carte */
function panelCarte(){
  const c=MENU.carte;
  return `<section class="panel" data-screen="2">
    <div class="cat">${esc(c.titre)}</div>
    <div class="fixed">
      <div class="note">${esc(c.note)}</div>
      <div class="rows">${c.gammes.map(g=>ligne(g,true)).join('')}</div>
    </div></section>`;
}

/* ÉCRAN 3 — à côté */
function panelCotes(){
  const c=MENU.cotes;
  return `<section class="panel" data-screen="3">
    <div class="cat">${esc(c.titre)}</div>
    <div class="fixed">
      <img class="bgph" src="img/${esc(c.photoFond)}" alt="" onerror="this.remove()">
      <div class="sect">${esc(c.petitesFaims.titre)}</div>
      ${c.petitesFaims.items.map(i=>ligne(i,false)).join('')}
      <div class="sect">${esc(c.autres.titre)}</div>
      ${c.autres.items.map(i=>ligne(i,false)).join('')}
    </div></section>`;
}

document.getElementById('screens').innerHTML = panelVitrine()+panelCarte()+panelCotes();

/* mode un écran par boîtier */
const solo=new URLSearchParams(location.search).get('ecran');
if(solo && ['1','2','3'].includes(solo)){
  document.body.classList.add('solo');
  document.querySelector(`[data-screen="${solo}"]`)?.classList.add('show');
}

/* rotation de la vitrine */
document.querySelectorAll('[data-rot]').forEach((panel,idx)=>{
  const sl=[...panel.querySelectorAll('.slide')], nav=[...panel.querySelectorAll('.dots i')];
  if(sl.length<2) return;
  const catTxt=panel.querySelector('.catTxt'), wipe=panel.querySelector('.wipe');
  let cur=0;
  const next=()=>{
    const prev=sl[cur];
    if(wipe){wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');}
    prev.classList.remove('on'); prev.classList.add('out'); nav[cur]?.classList.remove('on');
    setTimeout(()=>prev.classList.remove('out'),650);
    cur=(cur+1)%sl.length;
    setTimeout(()=>{
      sl[cur].classList.add('on'); nav[cur]?.classList.add('on');
      if(catTxt) catTxt.textContent=sl[cur].dataset.cat||'';
    },260);
  };
  const iv=MENU.affichage.duree;
  setTimeout(()=>{next();setInterval(next,iv)}, iv+idx*MENU.affichage.decalage);
});

/* en-tête, horloge, ouvert/fermé */
const mn=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function tick(){
  const d=new Date();
  document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const now=d.getHours()*60+d.getMinutes();
  const open=(MENU.info.horaires[d.getDay()]||[]).some(([a,b])=>{
    const f=mn(b)===0?1440:mn(b); return now>=mn(a)&&now<=f;});
  document.getElementById('state').className='state '+(open?'open':'shut');
  document.getElementById('stateTxt').textContent=open?'OUVERT':'FERMÉ';
}
document.getElementById('baseline').textContent=MENU.info.baseline;
document.getElementById('kiff').textContent=MENU.info.accroche;
document.getElementById('halal').textContent='☪ '+MENU.info.halal;
document.getElementById('footL').textContent=MENU.info.baseline+' · PRIX EN € SERVICE COMPRIS';
document.getElementById('footR').textContent=MENU.info.villes;
tick(); setInterval(tick,20000);
setTimeout(()=>location.reload(),6*60*60*1000);
</script>
</body>
</html>
