<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LE MISTRAL — Menuboard</title>
<!-- AUCUNE RESSOURCE EXTERNE : le board doit fonctionner sans internet.
     Pas de Google Fonts, pas de CDN. Si la connexion tombe en plein
     service, le board continue d'afficher le menu normalement. -->
<style>
/* ════════════════════════════════════════════════════════════
   LE MISTRAL — MENUBOARD
   Noir #0b0b0d + Or #FFCC01 · 1080p paysage
   Contenu : menu-data.js
   ════════════════════════════════════════════════════════════ */

/* Police d'affichage : dépose Anton.woff2 dans fonts/ pour le rendu
   optimal. Sans ce fichier, repli sur une condensée système. */
@font-face{
  font-family:'MistralDisplay';
  src:url('fonts/Anton.woff2') format('woff2');
  font-weight:400; font-display:swap;
}

:root{
  --ink:#0b0b0d;
  --panel:#121212;
  --gold:#FFCC01;
  --white:#fff;
  --smoke:#cfc8bd;

  --display:'MistralDisplay',Impact,'Haettenschweiler','Arial Narrow',
            'DejaVu Sans Condensed','Liberation Sans Narrow',sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',sans-serif;

  /* marge de sécurité 5% : aucun contenu ne doit toucher les bords
     (bezels des écrans + zone non sûre) */
  --safe-x:2.6vw;
  --safe-y:2.4vh;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ink);color:var(--white);
  font-family:var(--body);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

.board{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:var(--safe-y) var(--safe-x);
  gap:1.4vh;
}

/* ── EN-TÊTE ─────────────────────────────────────────────── */
.head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:2vw}
.brand{display:flex;align-items:center;gap:1.1vw;min-width:0}
.crown{width:5vh;height:auto;flex:0 0 auto}
.brand h1{
  font-family:var(--display);font-size:6.4vh;letter-spacing:.04em;
  line-height:1;color:var(--white);
}
.brand .sub{
  font-family:var(--display);font-size:1.5vh;letter-spacing:.42em;
  color:var(--gold);margin-top:.5vh;
}
.head-right{display:flex;align-items:center;gap:1.6vw}
/* badge or → texte NOIR (or sur blanc = 1,5:1, illisible) */
.halal{
  font-family:var(--display);font-size:2vh;letter-spacing:.14em;
  background:var(--gold);color:var(--ink);padding:.7vh 1.1vw;border-radius:.6vh;
}
.state{display:inline-flex;align-items:center;gap:.6vw;font-family:var(--display);
  font-size:2vh;letter-spacing:.1em}
.state i{width:1.3vh;height:1.3vh;border-radius:50%;display:block}
.state.open{color:var(--gold)}       .state.open i{background:var(--gold)}
.state.shut{color:#ff6b6b}           .state.shut i{background:#ff6b6b}
.clock{font-family:var(--display);font-size:3.6vh;letter-spacing:.04em;
  font-variant-numeric:tabular-nums}

/* ── GRILLE DES 4 PANNEAUX ───────────────────────────────── */
.screens{flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:repeat(3,1fr);gap:1vw}

/* MODE 1 ÉCRAN : un seul panneau occupe tout l'affichage.
   S'active avec ?ecran=1 / 2 / 3 dans l'adresse. */
body.solo .screens{grid-template-columns:1fr}
body.solo .panel{display:none}
body.solo .panel.show{display:flex}
body.solo .brand h1{font-size:4.4vh}
body.solo .crown{width:3.6vh}
body.solo .cat{font-size:3.6vh}
body.solo .cap .name{font-size:11vh}
body.solo .cap .price{font-size:10.5vh}
body.solo .tier .val{font-size:11vh}
body.solo .row .n{font-size:6.2vh}
body.solo .ladder .lname{font-size:4.4vh}
body.solo .qty s{font-size:4vh}
body.solo .qty b{font-size:2.3vh}
body.solo .grid2 .n{font-size:3.6vh!important}
body.solo .grid2 .p{font-size:3.8vh!important}
body.solo .sect{font-size:3.2vh}
body.solo .note{font-size:2.6vh}

/* Écran 3 en plein écran : la carte est dense, on profite de toute
   la largeur en 2 colonnes plutôt que de rapetisser le texte. */
body.solo [data-screen="3"] .fixed{column-count:2;column-gap:3vw;display:block}
body.solo [data-screen="3"] .ladder,
body.solo [data-screen="3"] .grid2,
body.solo [data-screen="3"] .sect{break-inside:avoid;margin-bottom:1.4vh}
body.solo [data-screen="3"] .grid2{grid-template-columns:1fr}

.panel{
  position:relative;min-height:0;overflow:hidden;border-radius:1.2vh;
  background:var(--panel);display:flex;flex-direction:column;
  box-shadow:0 0 0 2px rgba(255,204,1,.45);
}
/* bandeau de catégorie : or plein, texte noir */
.cat{
  flex:0 0 auto;background:var(--gold);color:var(--ink);
  font-family:var(--display);font-size:2.9vh;letter-spacing:.1em;
  padding:1.1vh 1vw;display:flex;align-items:center;justify-content:space-between;
}
.cat .new{
  font-size:.62em;letter-spacing:.14em;background:var(--ink);color:var(--gold);
  padding:.35em .7em;border-radius:.4em;
}

/* ── PANNEAUX FIXES (texte) ──────────────────────────────── */
.fixed{flex:1 1 auto;min-height:0;padding:1.4vh .9vw;display:flex;
  flex-direction:column;gap:.9vh;overflow:hidden}

.tiers{display:flex;gap:.6vw}
.tier{flex:1;background:#000;border:2px solid rgba(255,204,1,.5);
  border-radius:1vh;padding:1.1vh .4vw;text-align:center}
.tier .lab{display:block;font-size:1.45vh;font-weight:700;letter-spacing:.04em;
  color:var(--smoke);white-space:nowrap}
.tier .val{display:block;font-family:var(--display);font-size:6.8vh;
  line-height:1;color:var(--gold);margin-top:.5vh}
.tier .val .c{font-size:.46em;vertical-align:.5em;margin-left:.04em}

.note{font-size:1.65vh;color:var(--smoke);font-weight:500}

.list{display:flex;flex-direction:column;gap:1.15vh;flex:1 1 auto;min-height:0}
.row{display:flex;align-items:baseline;gap:.5vw}
.row .n{font-family:var(--display);font-size:4.3vh;letter-spacing:.02em;
  color:var(--white);line-height:1.05}
.row .dots{flex:1;border-bottom:2px dotted rgba(255,255,255,.18);
  transform:translateY(-.5vh)}
.row .p{font-family:var(--display);font-size:3.6vh;color:var(--gold);line-height:1}
.row .p .c{font-size:.46em;vertical-align:.5em;margin-left:.04em}
.row .sub{font-size:1.5vh;color:var(--smoke);font-weight:500}

/* échelles de quantité (wings, nuggets…) */
.ladder{display:flex;flex-direction:column;gap:.2vh}
.ladder .lname{font-family:var(--display);font-size:2.6vh;color:var(--white);line-height:1.05}
.ladder .lrow{display:flex;gap:.45vw;flex-wrap:wrap}
.qty{background:#000;border:1px solid rgba(255,204,1,.4);border-radius:.6vh;
  padding:.35vh .5vw;display:flex;align-items:baseline;gap:.35vw}
.qty b{font-size:1.5vh;color:var(--smoke);font-weight:800}
.qty s{font-family:var(--display);font-size:2.5vh;color:var(--gold);
  text-decoration:none;line-height:1}
.qty s .c{font-size:.46em;vertical-align:.5em}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.2vh .7vw}
.grid2 .n{white-space:nowrap}
.sect{font-family:var(--display);font-size:2vh;letter-spacing:.12em;
  color:var(--gold);border-bottom:2px solid rgba(255,204,1,.35);padding-bottom:.4vh}

/* ── PANNEAUX ROTATIFS (photo) ───────────────────────────── */
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .5s ease,visibility .5s}
.slide.on{opacity:1;visibility:visible}

.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Ken Burns : SEULE la photo bouge. Le texte reste parfaitement fixe
   (animer prix et libellés nuit à la lecture). */
.slide.on .photo{animation:ken 12s linear both}
@keyframes ken{from{transform:scale(1.03)}to{transform:scale(1.12)}}

.ph-fallback{position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 25%,rgba(255,204,1,.22),#0a0908 72%)}

/* voile sombre plein : garantit le contraste du texte quelle que
   soit la photo (une ombre portée ne suffit pas) */
.veil{position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(180deg,rgba(8,7,5,0),rgba(8,7,5,.88) 42%,rgba(8,7,5,.97))}

.cap{position:absolute;left:0;right:0;bottom:0;padding:1.4vh 1vw 2vh}
.cap .name{font-family:var(--display);font-size:8.8vh;line-height:.98;
  color:var(--white);letter-spacing:.01em}
.cap .desc{font-size:1.85vh;line-height:1.3;color:var(--smoke);
  font-weight:500;margin-top:.6vh}
.cap .price{display:inline-block;font-family:var(--display);font-size:8.4vh;
  line-height:1;background:var(--gold);color:var(--ink);
  padding:.9vh 1.1vw;border-radius:1vh;margin-top:1.1vh}
.cap .price .c{font-size:.46em;vertical-align:.52em;margin-left:.03em}

.flag{position:absolute;top:1.2vh;left:0;font-family:var(--display);
  font-size:1.8vh;letter-spacing:.12em;background:var(--gold);color:var(--ink);
  padding:.5vh .9vw;border-radius:0 .6vh .6vh 0}

.dots-nav{position:absolute;right:1vw;bottom:1.2vh;display:flex;gap:.45vw}
.dots-nav i{width:.9vh;height:.9vh;border-radius:50%;background:rgba(255,255,255,.28)}
.dots-nav i.on{background:var(--gold);width:2.6vh;border-radius:.45vh}

/* ── BANDEAU BAS ─────────────────────────────────────────── */
.foot{flex:0 0 auto;background:var(--gold);color:var(--ink);border-radius:1vh;
  padding:1vh 1.2vw;display:flex;align-items:center;justify-content:space-between;
  font-family:var(--display);font-size:2vh;letter-spacing:.09em;gap:2vw}
.foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


/* ══════════════════════════════════════════════════════════
   MOTION — ambiance de mur vidéo
   Tout est en transform/opacity (accéléré par le GPU) pour
   rester fluide sur un petit boîtier type Raspberry Pi.
   ══════════════════════════════════════════════════════════ */

/* fond vivant : deux halos dorés qui dérivent lentement */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient b{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5}
.ambient b:nth-child(1){width:60vw;height:60vw;left:-15vw;top:-20vw;
  background:rgba(255,204,1,.16);animation:drift1 26s ease-in-out infinite}
.ambient b:nth-child(2){width:50vw;height:50vw;right:-12vw;bottom:-18vw;
  background:rgba(255,160,1,.11);animation:drift2 34s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(12vw,6vh) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}
  50%{transform:translate(-10vw,-7vh) scale(1)}}

/* braises : particules qui montent lentement */
.embers{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.embers i{position:absolute;bottom:-3vh;width:.5vh;height:.5vh;border-radius:50%;
  background:var(--gold);opacity:0;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) scale(.6);opacity:0}
  12%{opacity:.75}
  85%{opacity:.5}
  100%{transform:translateY(-104vh) scale(1.25);opacity:0}}

/* onde lumineuse qui traverse les 3 écrans : signature mur vidéo */
.wall-sweep{position:fixed;top:0;bottom:0;width:38vw;z-index:40;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,204,1,.13) 42%,
    rgba(255,255,255,.1) 52%,transparent);
  transform:translateX(-45vw) skewX(-8deg);animation:wall 9s ease-in-out infinite}
@keyframes wall{0%{transform:translateX(-45vw) skewX(-8deg)}
  55%,100%{transform:translateX(150vw) skewX(-8deg)}}

/* reflet qui balaie les bandeaux dorés */
.cat,.foot,.halal{position:relative;overflow:hidden}
.cat::after,.foot::after,.halal::after{content:"";position:absolute;top:0;bottom:0;width:40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:translateX(-160%);animation:shine 7s ease-in-out infinite}
.foot::after{animation-delay:1.2s}.halal::after{animation-delay:2.4s}
@keyframes shine{0%{transform:translateX(-160%)}45%,100%{transform:translateX(320%)}}

/* couronne : scintillement discret */
.crown{animation:glow 4.5s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 .4vh rgba(255,204,1,.5))}
  50%{filter:drop-shadow(0 0 1.6vh rgba(255,204,1,.95))}}

/* ── TRANSITION DE SLIDE ── */
.slide{transform:scale(1.06);transition:opacity .55s ease,transform .8s cubic-bezier(.2,.8,.25,1),visibility .55s}
.slide.on{transform:scale(1)}
.slide.out{opacity:0;visibility:visible;transform:scale(.97) translateX(-2%);
  transition:opacity .45s ease,transform .6s ease}

/* volet doré qui essuie l'écran au changement */
.wipe{position:absolute;inset:0;z-index:7;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,var(--gold) 45%,#fff 50%,var(--gold) 55%,transparent 80%);
  transform:translateX(-115%) skewX(-10deg);opacity:.9}
.wipe.go{animation:wipe .85s cubic-bezier(.5,0,.3,1)}
@keyframes wipe{0%{transform:translateX(-115%) skewX(-10deg)}
  100%{transform:translateX(115%) skewX(-10deg)}}

/* photo : zoom + dérive, effet caméra */
.slide.on .photo{animation:kenPro 12s cubic-bezier(.3,0,.5,1) both}
@keyframes kenPro{
  0%{transform:scale(1.14) translate(1.5%,1%)}
  100%{transform:scale(1.02) translate(-1.5%,-1%)}}

/* ── TYPO CINÉTIQUE (écran vitrine uniquement) ──
   Les écrans de prix restent fixes : animer un prix nuit à la lecture. */
.name .w{display:inline-block;opacity:0;transform:translateY(.45em) rotateX(-55deg);
  transform-origin:50% 100%}
.slide.on .name .w{animation:wordIn .62s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes wordIn{to{opacity:1;transform:none}}

.cap .desc{opacity:0;transform:translateY(.5em)}
.slide.on .cap .desc{animation:softIn .6s .42s ease forwards}
@keyframes softIn{to{opacity:1;transform:none}}

/* prix : arrivée franche + halo qui pulse */
.cap .price{opacity:0;transform:translateY(.35em) scale(.86)}
.slide.on .cap .price{animation:priceIn .7s .55s cubic-bezier(.2,1.5,.4,1) forwards,
  priceGlow 3.2s 1.3s ease-in-out infinite}
@keyframes priceIn{to{opacity:1;transform:none}}
@keyframes priceGlow{0%,100%{box-shadow:0 0 2vh -.6vh rgba(255,204,1,.55)}
  50%{box-shadow:0 0 4.5vh -.3vh rgba(255,204,1,.95)}}

/* bandeau catégorie : bascule au changement */
.catTxt{display:inline-block;transition:opacity .3s,transform .3s}
.catTxt.swap{opacity:0;transform:translateY(-.5em)}

/* étiquette NOUVEAU : entrée + respiration */
.flag{opacity:0;transform:translateX(-110%)}
.slide.on .flag{animation:flagIn .6s .7s cubic-bezier(.2,.9,.3,1) forwards,
  flagPulse 2.6s 1.6s ease-in-out infinite}
@keyframes flagIn{to{opacity:1;transform:none}}
@keyframes flagPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* les prix fixes s'installent une fois au démarrage, puis ne bougent plus */
.tier,.ladder,.grid2 .row{opacity:0;animation:settle .6s ease forwards}
@keyframes settle{to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .ambient b,.embers i,.wall-sweep,.cat::after,.foot::after,.halal::after,
  .crown,.wipe,.slide.on .photo,.slide.on .name .w,.slide.on .cap .desc,
  .slide.on .cap .price,.slide.on .flag,.tier,.ladder,.grid2 .row{
    animation:none!important}
  .name .w,.cap .desc,.cap .price,.flag,.tier,.ladder,.grid2 .row{
    opacity:1!important;transform:none!important}
}

</style>
</head>
<body>
<div class="ambient"><b></b><b></b></div>
<div class="embers" id="embers"></div>
<div class="wall-sweep"></div>
<div class="board">

  <header class="head">
    <div class="brand">
      <svg class="crown" viewBox="0 0 120 90" aria-hidden="true">
        <path fill="#FFCC01" d="M6 84 L18 34 L38 58 L60 12 L82 58 L102 34 L114 84 Z"/>
      </svg>
      <div>
        <h1>LE&nbsp;MISTRAL</h1>
        <div class="sub">BURGER · KEBAB · TACOS</div>
      </div>
    </div>
    <div class="head-right">
      <span class="halal">✔ HALAL</span>
      <span class="state" id="state"><i></i><b id="stateTxt">—</b></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <main class="screens" id="screens"></main>

  <footer class="foot">
    <span id="footL"></span>
    <span id="footR"></span>
  </footer>
</div>

<script src="menu-data.js"></script>
<script>
/* ═══ PRIX — format français, sans centimes inutiles ═══
   7 → 7€      10.5 → 10€50                                   */
function price(v){
  if(v===null||v===undefined) return '';
  const e=Math.floor(v+1e-6);
  const c=Math.round((v-e)*100);
  return c===0 ? e+'€' : e+'€<span class="c">'+String(c).padStart(2,'0')+'</span>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ═══ PANNEAU FIXE 1 — ASSIETTES ═══ */
function panelAssiettes(){
  const a=MENU.assiettes;
  const tiers=a.tiers.map(t=>
    `<div class="tier"><span class="lab">${esc(t.label)}</span>
       <span class="val">${price(t.price)}</span></div>`).join('');

  let formule='';
  if(MENU.formule.enabled){
    formule=`<div class="row" style="margin-top:.4vh">
        <span class="n" style="color:var(--gold)">${esc(MENU.formule.label)}</span>
        <span class="dots"></span>
        <span class="p">+${price(MENU.formule.supplement)}</span>
      </div><div class="note">${esc(MENU.formule.detail)}</div>`;
  }

  const viandes=a.viandes.map(v=>{
    const star = MENU.mostOrdered.enabled && MENU.mostOrdered.item.includes(v)
      ? ' <span style="color:var(--gold);font-size:.5em">★</span>' : '';
    return `<div class="row"><span class="n">${esc(v)}${star}</span></div>`;
  }).join('');

  return `<section class="panel" data-screen="2">
    <div class="cat">${esc(a.title)}</div>
    <div class="fixed">
      <div class="tiers">${tiers}</div>
      <div class="note">${esc(a.note)}</div>
      ${formule}
      <div class="list">${viandes}</div>
    </div></section>`;
}

/* ═══ PANNEAU FIXE 2 — BOUCHÉES / PANINIS / BOISSONS ═══ */
function panelCarte(){
  const b=MENU.bouchees.items.map(i=>`
    <div class="ladder">
      <div class="lname">${esc(i.name)}</div>
      <div class="lrow">${i.tiers.map(([q,p])=>
        `<span class="qty"><b>${esc(q)}</b><s>${price(p)}</s></span>`).join('')}</div>
    </div>`).join('');

  const line=i=>
    `<div class="row"><span class="n" style="font-size:2.2vh">${esc(i.name)}</span>
       <span class="dots"></span><span class="p" style="font-size:2.4vh">${price(i.price)}</span></div>`;
  const p=`<div class="grid2">${MENU.paninis.items.map(line).join('')}</div>`;
  const e=`<div class="grid2">${MENU.extras.items.map(line).join('')}</div>`;

  return `<section class="panel" data-screen="3">
    <div class="cat">${esc(MENU.bouchees.title)} · ${esc(MENU.paninis.title)}</div>
    <div class="fixed">
      ${b}
      <div class="sect">${esc(MENU.paninis.title)}</div>${p}
      <div class="sect">${esc(MENU.extras.title)}</div>${e}
    </div></section>`;
}

/* ═══ ÉCRAN VITRINE (photos qui défilent) ═══ */
function panelVitrine(){
  const slides=MENU.vitrine.slides.map((s,i)=>{
    const flag = s.badge ? '<div class="flag">NOUVEAU</div>'
      : (MENU.mostOrdered.enabled && MENU.mostOrdered.item===s.name
          ? '<div class="flag">LE PLUS COMMANDÉ</div>' : '');
    const pr = s.price===null||s.price===undefined ? '' : `<div class="price">${price(s.price)}</div>`;
    return `<div class="slide${i===0?' on':''}" data-cat="${esc(s.cat||'')}">
        <div class="ph-fallback"></div>
        <img class="photo" alt="${esc(s.name)}"
             data-local="img/menu/${esc(s.img)}" data-cdn="${esc(s.cdn||'')}">
        <div class="veil"></div>
        ${flag}
        <div class="cap">
          <div class="name">${esc(s.name).split(" ").map((w,k)=>`<span class="w" style="animation-delay:${.14+k*.09}s">${w}</span>`).join(" ")}</div>
          <div class="desc">${esc(s.desc||'')}</div>
          ${pr}
        </div></div>`;
  }).join('');
  const nav=MENU.vitrine.slides.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');
  return `<section class="panel" data-screen="1" data-rot="1">
    <div class="cat"><span class="catTxt">${esc(MENU.vitrine.slides[0].cat||'')}</span></div>
    <div class="stage">${slides}<div class="wipe" id="wipe"></div><div class="dots-nav">${nav}</div></div>
  </section>`;
}

/* ═══ CONSTRUCTION ═══ */
/* Ordre sur le mur :
   ÉCRAN 1 (gauche)  vitrine photos — les nouveautés se découvrent
                     en premier dans le sens de lecture
   ÉCRAN 2 (centre)  assiettes — zone la plus regardée, donc le
                     produit principal et ses prix
   ÉCRAN 3 (droite)  le reste de la carte                        */
document.getElementById('screens').innerHTML =
    panelVitrine() + panelAssiettes() + panelCarte();

/* ?ecran=1|2|3 → ce panneau seul, en plein écran.
   Sans paramètre → les 3 côte à côte. */
const solo=new URLSearchParams(location.search).get('ecran');
if(solo && ['1','2','3'].includes(solo)){
  document.body.classList.add('solo');
  const el=document.querySelector(`[data-screen="${solo}"]`);
  if(el) el.classList.add('show');
}

/* Images : local d'abord, CDN en secours, puis dégradé.
   Aucune requête réseau si les fichiers locaux sont présents. */
document.querySelectorAll('img.photo').forEach(img=>{
  const local=img.dataset.local, cdn=img.dataset.cdn;
  img.addEventListener('error',()=>{
    if(img.src.indexOf(local)>-1 && cdn){ img.src=cdn; }
    else { img.remove(); }
  });
  img.src=local;
});

/* Rotation : seuls les 2 panneaux photo tournent, en décalé.
   Les prix de base restent visibles en permanence. */
document.querySelectorAll('[data-rot]').forEach((panel,idx)=>{
  const slides=[...panel.querySelectorAll('.slide')];
  const nav=[...panel.querySelectorAll('.dots-nav i')];
  if(slides.length<2) return;
  let cur=0;
  const catTxt=panel.querySelector('.catTxt');
  const wipe=panel.querySelector('.wipe');
  const next=()=>{
    const prev=slides[cur];
    // volet doré qui essuie l'écran
    if(wipe){ wipe.classList.remove('go'); void wipe.offsetWidth; wipe.classList.add('go'); }
    prev.classList.remove('on'); prev.classList.add('out');
    nav[cur]?.classList.remove('on');
    setTimeout(()=>prev.classList.remove('out'),650);

    cur=(cur+1)%slides.length;
    // la slide entrante apparaît derrière le volet, à mi-balayage
    setTimeout(()=>{
      slides[cur].classList.add('on');
      nav[cur]?.classList.add('on');
      if(catTxt){
        catTxt.classList.add('swap');
        setTimeout(()=>{ catTxt.textContent=slides[cur].dataset.cat||'';
                         catTxt.classList.remove('swap'); },300);
      }
    },260);
  };
  setTimeout(()=>{ next(); setInterval(next,MENU.display.dwell); },
             MENU.display.dwell + idx*MENU.display.stagger);
});

/* ═══ HORLOGE + OUVERT/FERMÉ ═══ */
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function tick(){
  const d=new Date();
  document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const now=d.getHours()*60+d.getMinutes();
  const open=(MENU.info.hours[d.getDay()]||[]).some(([a,b])=>now>=mins(a)&&now<=mins(b));
  const el=document.getElementById('state');
  el.className='state '+(open?'open':'shut');
  document.getElementById('stateTxt').textContent=open?'OUVERT':'FERMÉ';
}
document.getElementById('footL').textContent='✔ 100% HALAL · PRIX EN € SERVICE COMPRIS';
document.getElementById('footR').textContent=MENU.info.address;
tick(); setInterval(tick,20000);

/* braises : 16 particules suffisent pour l'effet sans charger le boîtier */
(function(){
  const box=document.getElementById('embers'); if(!box) return;
  let html='';
  for(let i=0;i<16;i++){
    html+=`<i style="left:${Math.random()*100}%;
      animation-duration:${9+Math.random()*9}s;
      animation-delay:${-Math.random()*16}s;
      transform:scale(${.6+Math.random()*1.1})"></i>`;
  }
  box.innerHTML=html;
})();

/* les blocs de prix s'installent en cascade au démarrage, puis restent fixes */
document.querySelectorAll('.tier,.ladder,.grid2 .row').forEach((el,i)=>{
  el.style.animationDelay=(0.15+i*0.055)+'s';
});

/* Auto-rechargement quotidien : remet le board à neuf sans intervention
   (protège d'une page figée après des jours d'affichage continu). */
setTimeout(()=>location.reload(),6*60*60*1000);
</script>
</body>
</html>
